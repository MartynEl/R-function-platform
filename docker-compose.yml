version: '3.8'

services:
  # 1. Аналитическая база логов и метаданных
  clickhouse_db:
    image: clickhouse/clickhouse-server:latest
    container_name: r_clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_PORT_HTTP}:8123"
      - "${CLICKHOUSE_PORT_NATIVE}:9000"
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # 2. Сервис Онлайн-Ранжирования (FastAPI + Milvus Lite)
  ranking_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: r_ranking_fastapi
    restart: always
    env_file: .env
    command: uvicorn ranking_service.main:app --host 0.0.0.0 --port 8080
    ports:
      - "${SERVER_PORT}:8080"
    environment:
      - CLICKHOUSE_HOST=clickhouse_db
    depends_on:
      - clickhouse_db

  # 3. Внешний генератор трафика (Симулятор Smart Feed)
  traffic_simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: r_traffic_sim
    restart: always
    env_file: .env
    command: python init_data/simulate_traffic.py
    environment:
      - CLICKHOUSE_HOST=clickhouse_db
      - SERVER_HOST=ranking_service
      - SERVER_PORT=8080
    depends_on:
      - ranking_service

  # 4. Планировщик офлайн-обучения (Dagster + dbt на Cron)
  offline_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: r_offline_worker
    restart: always
    command: sh -c "crontab train_service/crontab && cron -f"
    environment:
      - CLICKHOUSE_HOST=clickhouse_db
    depends_on:
      - clickhouse_db

volumes:
  chdata:
